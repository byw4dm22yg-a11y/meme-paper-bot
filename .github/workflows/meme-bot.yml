name: meme-paper-bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meme-paper-bot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run meme paper bot
        run: python meme_bot.py
      - name: Save logs
        if: always()
        run: |
          git config user.name "meme-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in meme_state.json meme_trades.csv meme_equity.csv meme_funnel.csv meme_probe.json; do [ -f "$f" ] && git add "$f"; done
          git commit -m "meme paper run" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
